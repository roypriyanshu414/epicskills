<style>

:root[data-theme="dark"] .btn:not(.o):not(.d){color:var(--onac)}.btn.d{color:#fff}.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}

<script>
/* ===== safe storage: falls back to memory if the browser blocks localStorage (private/sandboxed mode) ===== */
const mkS=n=>{const m={};const S=()=>window[n];return{get(k){if(k in m)return m[k];try{return S().getItem(k)}catch{return null}},set(k,v){try{S().setItem(k,v);delete m[k];return true}catch{m[k]=v;return false}},del(k){delete m[k];try{S().removeItem(k)}catch{}}}};
const LS=mkS('localStorage'),SS=mkS('sessionStorage');
/* SHA-256 (pure JS, works on http/file too) — demo password hashing only. Production: server-side hashing (bcrypt/argon2) */
const sha256=(()=>{const K=[],H0=[];let n=2,c=0;while(c<64){let p=1;for(let i=2;i*i<=n;i++)if(n%i===0){p=0;break}if(p){K[c]=(Math.cbrt(n)%1*2**32)|0;if(c<8)H0[c]=(Math.sqrt(n)%1*2**32)|0;c++}n++}
const R=(v,k)=>(v>>>k)|(v<<(32-k));
return s=>{const b=new TextEncoder().encode(s),l=b.length,N=((l+9+63)>>6)<<4,w=new Uint32Array(N),x=new Uint32Array(64),h=H0.slice();
for(let i=0;i<l;i++)w[i>>2]|=b[i]<<(24-(i&3)*8);w[l>>2]|=0x80<<(24-(l&3)*8);w[N-1]=l*8;
for(let o=0;o<N;o+=16){for(let i=0;i<16;i++)x[i]=w[o+i];
for(let i=16;i<64;i++){const a=x[i-15],d=x[i-2];x[i]=(x[i-16]+(R(a,7)^R(a,18)^(a>>>3))+x[i-7]+(R(d,17)^R(d,19)^(d>>>10)))|0}
let[a,b2,c2,d,e,f,g,q]=h;
for(let i=0;i<64;i++){const t1=(q+(R(e,6)^R(e,11)^R(e,25))+((e&f)^(~e&g))+K[i]+x[i])|0,t2=((R(a,2)^R(a,13)^R(a,22))+((a&b2)^(a&c2)^(b2&c2)))|0;q=g;g=f;f=e;e=(d+t1)|0;d=c2;c2=b2;b2=a;a=(t1+t2)|0}
[a,b2,c2,d,e,f,g,q].forEach((v,i)=>h[i]=(h[i]+v)|0)}
return h.map(v=>(v>>>0).toString(16).padStart(8,'0')).join('')}})();
const hp=(salt,pw)=>{let h=salt+pw;for(let i=0;i<1500;i++)h=sha256(h+salt+pw);return h};
const rnd=()=>{try{return[...crypto.getRandomValues(new Uint8Array(12))].map(x=>x.toString(16).padStart(2,'0')).join('')}catch{return Math.random().toString(16).slice(2)+Date.now().toString(16)}};
document.documentElement.dataset.theme=LS.get("sl_theme")||"light";
/* ===== data layer (swap Store for Supabase/Firebase calls later) ===== */
const CATS=['Self Development','Productivity','Career','Finance','Business','Motivation','Study','Other'];
const LANGS=['English','Hindi','Other'];
const LL=l=>l==='Hindi'?'हिंदी':l;
const mk=(id,group,title,language,category,price,short,extra={})=>({id,group,title,language,category,price,originalPrice:'',author:'Demo Author',coverUrl:'',pdfFile:'',shortDescription:short,description:short+' (Sample content for the prototype.)',whatYouLearn:['Sample point one','Sample point two','Sample point three'],whoItsFor:['Anyone who wants simple, practical ideas'],pages:40,publicationDate:'2026-01-01',tags:[],featured:false,published:true,createdAt:Date.now()-Object.keys(extra).length*0-id.length,...extra});
const seed=()=>({books:[
 mk('b1','silent-engine','The Silent Engine','English','Self Development',49,'A practical guide to building quiet, steady daily momentum.',{featured:true,createdAt:Date.now()-1000}),
 mk('b2','silent-engine','The Silent Engine','Hindi','Self Development',49,'रोज़ की शांत और स्थिर प्रगति बनाने की व्यावहारिक गाइड।',{featured:true,createdAt:Date.now()-900}),
 mk('b3','demo-money','Sample: Money Basics','English','Finance',39,'Demo book — shows how a Finance title looks in the store.',{tags:['demo'],createdAt:Date.now()-800}),
 mk('b4','demo-study','Sample: पढ़ाई की आदत','Hindi','Study',30,'डेमो किताब — Study श्रेणी का उदाहरण।',{tags:['demo'],createdAt:Date.now()-700}),
 mk('b5','demo-career','Sample: Career Starter Notes','English','Career',50,'Demo book — shows how a Career title looks in the store.',{tags:['demo'],featured:true,createdAt:Date.now()-600})],
 orders:[],settings:{name:'The Silent Library',description:'Practical digital books in English and Hindi.',email:'hello@example.com',instagram:'',currency:'INR',defaultPrice:49,logo:''}});
const Store={/* books+orders: 'sl_db' · site settings: 'sl_settings' · users: 'sl_users' · admin: 'sl_admin_cred' */
load(){let d=null,s=null;try{d=JSON.parse(LS.get('sl_db'))}catch{}try{s=JSON.parse(LS.get('sl_settings'))}catch{}
 if(d&&d.books){if(s)d.settings=s;return d}d=seed();this.save(d);return d},
save(d){const{settings,...rest}=d;if(!LS.set('sl_db',JSON.stringify(rest))|!LS.set('sl_settings',JSON.stringify(settings))){try{toast('Browser storage is full or blocked — changes may not persist. Try a smaller cover image.')}catch{}}}};
let DB=Store.load();const save=()=>Store.save(DB);
const getCart=()=>{try{return JSON.parse(LS.get('sl_cart'))||[]}catch{return[]}};
const setCart=c=>{LS.set('sl_cart',JSON.stringify(c));cartBadge()};
/* ===== payment service: NO verification here. Production: Razorpay etc. ===== */
const Payments={
 /* Prototype: only creates a PENDING order. Production: call your backend, which creates a gateway order using
    PAYMENT_KEY / PAYMENT_SECRET (server env vars), then opens the gateway checkout. */
 start(cust,items){const o={id:'ORD-'+Date.now().toString(36).toUpperCase(),...cust,items,amount:items.reduce((s,i)=>s+i.price*i.qty,0),status:'Pending',ref:'',date:Date.now(),downloaded:false};DB.orders.unshift(o);save();return o},
 /* Production: this happens ONLY in a backend webhook after verifying the signature with WEBHOOK_SECRET. */
 demoSimulateWebhook(id){const o=DB.orders.find(x=>x.id===id);if(o){o.status='Paid';o.ref='DEMO-'+id;save()}}};
/* ===== helpers ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rs=n=>'₹'+Number(n||0);
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)};
const COL=['#0f766e','#7c3aed','#b45309','#be123c','#1d4ed8','#4d7c0f'];
const cover=b=>{const c=COL[[...b.id].reduce((a,x)=>a+x.charCodeAt(0),0)%COL.length];return `<div class="cover" style="background:${c}">${b.coverUrl?`<img src="${esc(b.coverUrl)}" alt="">`:''}<span style="position:relative">${b.coverUrl?'':esc(b.title)}<small>${b.coverUrl?'':LL(b.language)}</small></span></div>`};
const pr=b=>b.price>0?rs(b.price):'Free';const safe=u=>/^https?:\/\//i.test(u||'')?u:'';
const bookById=id=>DB.books.find(b=>b.id===id);
const pubBooks=()=>DB.books.filter(b=>b.published);
const sold=id=>DB.orders.filter(o=>o.items.some(i=>i.id===id)).length;
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'book';
const lines=s=>String(s||'').split('\n').map(x=>x.trim()).filter(Boolean);
const imgData=f=>new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};im.onerror=()=>res(r.result);im.src=r.result};r.readAsDataURL(f)});
const fileData=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)});
const isAdmin=()=>SS.get('sl_admin')==='1';
function cartBadge(){const n=getCart().reduce((s,i)=>s+i.qty,0);$('#cartlink').textContent='Cart'+(n?` (${n})`:'');$('#brand').textContent=DB.settings.name}
/* ===== customer UI ===== */
const card=b=>`<div class="card"><a href="#/book/${b.id}">${cover(b)}</a><div><span class="tag">${LL(b.language)}</span> <span class="tag">${esc(b.category)}</span></div><b>${esc(b.title)}</b><div class="mu">by ${esc(b.author)}</div><div class="mu">${esc(b.shortDescription)}</div><div class="price">${pr(b)} ${b.originalPrice?`<span class="old">${rs(b.originalPrice)}</span>`:''}</div><div class="row"><a class="btn o s" href="#/book/${b.id}">View Details</a>${b.price>0?`<button class="btn s" data-act="buy" data-id="${b.id}">Buy Now</button>`:safe(b.link)?`<a class="btn s" href="${esc(safe(b.link))}" target="_blank" rel="noopener">Read Free</a>`:''}</div></div>`;
const BookGrid=l=>l.length?`<div class="grid">${l.map(card).join('')}</div>`:'<p class="mu">No books found.</p>';
let F={q:'',l:'All',c:'All',s:'popular'};
function filtered(){const q=F.q.toLowerCase();let l=pubBooks().filter(b=>(F.l==='All'||b.language===F.l)&&(F.c==='All'||b.category===F.c)&&(!q||[b.title,b.category,b.language,LL(b.language),b.shortDescription,b.description,b.tags.join(' ')].join(' ').toLowerCase().includes(q)));
 const s={lo:(a,b)=>a.price-b.price,hi:(a,b)=>b.price-a.price,new:(a,b)=>b.createdAt-a.createdAt,popular:(a,b)=>sold(b.id)-sold(a.id)||(b.featured-a.featured)};return l.sort(s[F.s])}
const sec=(t,l,more)=>l.length?`<section><div class="sh"><h2>${t}</h2><a href="${more}">View all →</a></div>${BookGrid(l.slice(0,4))}</section>`:'';
const pHome=()=>{const P=pubBooks(),L=x=>P.filter(b=>b.language===x);return `<div class="hero"><h1>Good Books. Simple Prices.</h1><p>Practical digital books in English and Hindi — starting from just ₹30.</p><form id="hs" class="hs"><input name="q" placeholder="Search books, categories, languages…" aria-label="Search books"><button class="btn">Search</button></form><div class="row"><a class="btn o" href="#/books?l=Hindi">Hindi Books</a><a class="btn o" href="#/books?l=English">English Books</a></div></div>`+sec('Featured Books',P.filter(b=>b.featured),'#/books?l=All')+sec('Latest Books',[...P].sort((a,b)=>b.createdAt-a.createdAt),'#/books?l=All')+sec('Hindi Books',L('Hindi'),'#/books?l=Hindi')+sec('English Books',L('English'),'#/books?l=English')+sec('Popular Books',[...P].sort((a,b)=>sold(b.id)-sold(a.id)||b.featured-a.featured),'#/books?l=All')};
const pBooks=(qs)=>{F.l=qs.get('l')||F.l;F.c=qs.get('c')||F.c;return `<h2>Books</h2><div class="bar"><input id="q" placeholder="Search title, category, language…" value="${esc(F.q)}"></div><div class="bar" id="lf">${['All','English','Hindi'].map(l=>`<button class="chip ${F.l===l?'on':''}" data-act="lang" data-v="${l}">${l==='Hindi'?'हिंदी':l}</button>`).join('')}</div><div class="bar"><select id="cf"><option>All</option>${CATS.map(c=>`<option ${F.c===c?'selected':''}>${c}</option>`).join('')}</select><select id="sf">${[['popular','Popular'],['new','Newest'],['lo','Price: Low to High'],['hi','Price: High to Low']].map(([v,t])=>`<option value="${v}" ${F.s===v?'selected':''}>${t}</option>`).join('')}</select></div><div id="res">${BookGrid(filtered())}</div>`};

function userAuth(k,v){const email=(v.e||'').trim().toLowerCase();

 if(act==='add'){addCart(id);toast('Added to cart')}
 else if(act==='buy'){addCart(id);location.hash='#/checkout'}
 else if(act==='rm'){setCart(getCart().filter(i=>i.id!==id));route()}
 else if(act==='qty'){const c=getCart(),x=c.find(i=>i.id===id);x.qty=Math.max(1,x.qty+ +a.dataset.d);setCart(c);route()}
 else if(act==='lang'){F.l=a.dataset.v;route()}
 else if(act==='sim'){Payments.demoSimulateWebhook(id);route()}
 else if(act==='dl'){const o=DB.orders.find(x=>x.id===id);const f=o.items.map(i=>bookById(i.id)).filter(b=>b&&safe(b.link));o.downloaded=true;save();if(f.length)window.open(safe(f[0].link),'_blank','noopener');else toast('No file is attached to this book yet. The admin must add a book link.')}
 else if(act==='ulogout'){LS.del('sl_user');toast('You have been logged out.');location.hash='#/';route()}
 else if(act==='areset'){e.preventDefault();confirmBox('Reset the admin account? Books and orders are kept. You will create new admin credentials.',()=>{LS.del(A_KEY);SS.del('sl_admin');route();toast('Admin account reset')},'Reset')}
 else if(act==='logout'){e.preventDefault();SS.del('sl_admin');toast('Admin logged out.');location.hash='#/admin'; route()}
 else if(act==='tg'){const b=bookById(id);b[a.dataset.f]=!b[a.dataset.f];save();route()}
 else if(act==='dup'){const b=bookById(id),n={...JSON.parse(JSON.stringify(b)),id:'b'+Date.now(),title:b.title,published:false,createdAt:Date.now()};DB.books.unshift(n);save();toast('Duplicated as draft — change the language and PDF');location.hash='#/admin/edit/'+n.id}
 else if(act==='del')confirmBox('Are you sure you want to delete this book?',()=>{DB.books=DB.books.filter(b=>b.id!==id);save();route();toast('Book deleted')})});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='q'||t.id==='cf'||t.id==='sf'){if(t.id==='q')F.q=t.value;if(t.id==='cf')F.c=t.value;if(t.id==='sf')F.s=t.value;$('#res').innerHTML=BookGrid(filtered())}
 if(['aq','al','ac','as','ao'].includes(t.id)){AF[{aq:'q',al:'l',ac:'c',as:'s',ao:'o'}[t.id]]=t.value;$('#arows').innerHTML=adminRows()}
 if(t.id==='os'){const o=DB.orders.find(x=>x.id===t.dataset.id);o.status=t.value;save();toast('Status updated')}});
document.addEventListener('change',async e=>{const t=e.target;
 if(t.id==='cv'&&t.files[0]){const d=await imgData(t.files[0]);t.dataset.url=d;$('#cvp').innerHTML=`<img src="${d}" style="width:90px;border-radius:6px">`}
 if(t.id==='pf'&&t.files[0]){t.dataset.name=t.files[0].name;$('#pdfn').textContent=t.files[0].name}
 if(t.id==='lg'&&t.files[0])t.dataset.url=await fileData(t.files[0])});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,v=Object.fromEntries(new FormData(f));
 if(f.id==='login'){adminAuth(v)}
 else if(f.id==='hs'){F.q=v.q.trim();F.l='All';F.c='All';location.hash='#/books?l=All';route()}
 else if(f.id==='au'){userAuth(f.dataset.k,v)}
 else if(f.id==='co'){const items=cartItems().map(({b,qty})=>({id:b.id,title:b.title,language:b.language,price:b.price,qty}));const o=Payments.start({name:v.name,email:v.email,phone:v.phone},items);setCart([]);location.hash='#/order/'+o.id}
 else if(f.id==='bf'){if(v.link&&!safe(v.link.trim()))return toast('Book link must start with https://');if(!(+v.price>=0))return toast('Enter a price of 0 or more');const mode=e.submitter&&e.submitter.dataset.mode,id=f.dataset.id,old=id?bookById(id):null;
  const b={...(old||{id:'b'+Date.now(),createdAt:Date.now()}),title:v.title.trim(),author:v.author,shortDescription:v.shortDescription,description:v.description,language:v.language,category:v.category,price:Math.max(0,+v.price||0),link:(v.link||'').trim(),originalPrice:v.originalPrice?+v.originalPrice:'',pages:v.pages,publicationDate:v.publicationDate,whatYouLearn:lines(v.whatYouLearn),whoItsFor:lines(v.whoItsFor),tags:v.tags.split(',').map(x=>x.trim()).filter(Boolean),group:v.group.trim()||slug(v.title),featured:!!v.featured,published:mode==='draft'?false:!!v.published};
  const cu=$('#cv').dataset.url,pn=$('#pf').dataset.name;if(cu)b.coverUrl=cu;else b.coverUrl=b.coverUrl||'';if(pn)b.pdfFile=pn;else b.pdfFile=b.pdfFile||'';
  if(old)Object.assign(old,b);else DB.books.unshift(b);save();toast(old?'Book updated.':!b.published?'Book saved as draft (not public yet).':'Book published — it is now live in the store.');location.hash='#/admin/books'}
 else if(f.id==='sf2'){Object.assign(DB.settings,v,{defaultPrice:+v.defaultPrice});const l=$('#lg').dataset.url;if(l)DB.settings.logo=l;save();cartBadge();toast('Settings saved')}});
$('#burger').onclick=()=>{const o=$('#links').classList.toggle('open');$('#burger').setAttribute('aria-expanded',o)};
$('#theme').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;LS.set('sl_theme',t)};
route();
</script></body></html>
